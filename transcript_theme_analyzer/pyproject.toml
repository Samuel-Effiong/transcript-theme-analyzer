[project]
name = "transcript-theme-analyzer"
version = "0.1.0"
description = "Model-agnostic transcript theme-relevance analyzer (OpenAI SDK, OpenAI/OpenRouter compatible)."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.50.0",
    "pydantic>=2.6.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
